# CI for landing: version-bump check, .NET build/format/tests on a real Postgres
# (bootstrap + migrations + the app-role privilege check), the page's lint/format/
# typecheck/build, and a non-pushing Docker build.
# Also called by release.yml so a release only publishes what passed these checks.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly sweep to catch upstream breakage when nobody is pushing
    - cron: "41 3 * * 1"
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # Stable name so branch protection has one required status check to point at
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Same major/minor as stacks/postgres
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: ci-only-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Throwaway credentials for the CI service container only.
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: ci-only-superuser
      LANDING_TEST_ADMIN: Host=127.0.0.1;Port=5432;Username=postgres;Password=ci-only-superuser;Database=postgres
      ConnectionStrings__Migrator: Host=127.0.0.1;Port=5432;Database=landing_db;Username=landing_migrator;Password=ci-migrator
      LANDING_TEST_APP: Host=127.0.0.1;Port=5432;Database=landing_db;Username=landing_app;Password=ci-app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the version check can compare against the base branch
          fetch-depth: 0

      # Backs the version hook (.githooks/): a PR that changes code must change the version.
      # Dependabot PRs are exempt (dependency-only merges are not bumped).
      - name: Check the version was bumped
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: .githooks/check-version-bump "origin/$BASE_REF" HEAD

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/Landing.Web/package-lock.json

      - name: Restore (locked)
        run: |
          dotnet restore Landing.slnx --locked-mode
          dotnet tool restore

      - name: Build (warnings as errors)
        run: dotnet build Landing.slnx -c Release --no-restore -warnaserror

      - name: Verify formatting
        run: dotnet format Landing.slnx --verify-no-changes --no-restore

      - name: Bootstrap landing_db and roles (as production does)
        run: psql -v ON_ERROR_STOP=1 -v migrator_password=ci-migrator -v app_password=ci-app -d postgres -f db/bootstrap.sql

      - name: Apply migrations as the migrator role
        run: dotnet run --project src/Landing.Api -c Release --no-build -- migrate

      - name: Run tests
        run: dotnet test Landing.slnx -c Release --no-build

      - name: Page (install, lint, format, typecheck, build)
        working-directory: src/Landing.Web
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run format:check
          npm run typecheck
          npm run build

      # Build the image without pushing so a broken Dockerfile fails the PR
      - name: Build Docker image (no push)
        run: docker build --tag landing:ci --file Dockerfile .
