<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>homelab & good vibes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes scanPulse{0%,100%{box-shadow:0 0 0 0 oklch(70% 0.13 130 / .5)}70%{box-shadow:0 0 0 14px oklch(70% 0.13 130 / 0)}100%{box-shadow:0 0 0 0 oklch(70% 0.13 130 / 0)}}
@keyframes slowSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
body{margin:0;font-family:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif}
.app-wrap{display:flex;justify-content:center;padding:40px;background:oklch(90% 0.015 75);min-height:100vh;box-sizing:border-box}
.ios-frame{position:relative;width:390px;height:844px;background:radial-gradient(circle at 50% -10%, oklch(88% 0.05 75) 0%, oklch(95% 0.025 75) 45%);overflow:hidden;border-radius:44px;box-shadow:0 24px 80px oklch(40% 0.05 60 / .25),inset 0 0 0 2px oklch(60% 0.08 60 / .15)}
.lock-screen{position:absolute;inset:0;z-index:50;background:radial-gradient(circle at 50% 20%, oklch(90% 0.05 75) 0%, oklch(96% 0.02 75) 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:opacity .4s ease,transform .4s ease;padding-top:54px}
.lock-screen.unlocking{opacity:0;transform:scale(1.04);pointer-events:none}
.app-content{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll-area{flex:1;overflow-y:auto;padding:58px 18px 12px}
.scroll-area::-webkit-scrollbar{width:0}
.tab-bar{display:flex;border-top:1.5px solid oklch(60% 0.08 60 / .2);background:oklch(94% 0.025 78);padding:8px 0 22px;flex-shrink:0}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;cursor:pointer;user-select:none}
.tab-icon-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;width:18px;height:18px}
.tab-icon-grid div{border-radius:2px}
.tab-label{font-size:10.5px;font-weight:700}
.search-wrap{position:relative;margin-bottom:22px}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:15px;height:15px;border:2px solid oklch(52% 0.03 55);border-radius:50%}
.search-handle{position:absolute;left:24px;top:50%;transform:translateY(3px) rotate(45deg);width:2px;height:8px;background:oklch(52% 0.03 55);border-radius:1px}
.search-input{width:100%;padding:12px 14px 12px 40px;border-radius:18px;border:1.5px solid oklch(60% 0.08 60 / .3);background:oklch(97% 0.015 78);color:oklch(30% 0.03 50);font-size:15px;outline:none;font-family:inherit;transition:border-color .2s}
.search-input:focus{border-color:oklch(60% 0.15 40)}
.section-title{font-family:'Kalam',cursive;font-size:16px;font-weight:700;margin-bottom:10px}
.app-row{display:flex;align-items:center;gap:10px;padding:11px;border-radius:18px;background:oklch(97% 0.015 78);border:1px solid oklch(60% 0.08 60 / .2);min-height:44px}
.app-row.search{gap:12px;padding:11px}
.app-icon{border-radius:42% 58% 61% 39% / 45% 48% 52% 55%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.app-icon span{color:oklch(98% 0.005 80);font-weight:800}
.status-dot{border-radius:50%;flex-shrink:0}
.fav-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.fav-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border-radius:20px;background:oklch(97% 0.015 78);border:1px solid oklch(60% 0.08 60 / .2);cursor:pointer;transition:transform .2s,box-shadow .2s}
.fav-card:hover{transform:translateY(-2px);box-shadow:0 6px 14px oklch(50% 0.1 60 / .15)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.card{padding:14px;border-radius:20px;background:oklch(97% 0.015 78);border:1px solid oklch(60% 0.08 60 / .2)}
.bar-track{height:5px;border-radius:3px;background:oklch(60% 0.08 60 / .15);overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .6s ease}
.external-row{position:relative;display:flex;align-items:center;gap:10px;padding:11px;border-radius:18px;background:oklch(94% 0.03 320);border:1.5px dashed oklch(55% 0.1 320 / .5);min-height:44px}
.add-app{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:18px;border:1.5px dashed oklch(60% 0.08 60 / .4);color:oklch(50% 0.03 55);font-size:13px;font-weight:700;cursor:pointer}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px;background:oklch(97% 0.015 78)}
.settings-group{display:flex;flex-direction:column;gap:1px;border-radius:20px;overflow:hidden;background:oklch(60% 0.08 60 / .2);margin-bottom:20px}
.toggle{width:44px;height:26px;border-radius:13px;position:relative;flex-shrink:0;transition:background .2s;cursor:pointer}
.toggle-thumb{position:absolute;top:2px;width:22px;height:22px;border-radius:50%;background:white;transition:left .2s}
.lock-btn{text-align:center;padding:14px;border-radius:18px;background:oklch(97% 0.015 78);color:oklch(58% 0.16 30);font-size:14.5px;font-weight:700;cursor:pointer;margin-top:4px}
.faceid-outer{position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center}
.faceid-ring{position:absolute;inset:0;animation:slowSpin 40s linear infinite}
.faceid-ring div{position:absolute;border-radius:3px}
.faceid-core{position:relative;width:52px;height:52px;border-radius:42% 58% 61% 39% / 45% 48% 52% 55%;transition:background .3s}
.faceid-core.scanning{animation:scanPulse 1.1s ease-out infinite}
</style>
</head>
<body>
<div class="app-wrap">
  <div class="ios-frame" id="app"></div>
</div>
<script src="app.js"></script>
</body>
</html>
